<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="Style7.css">
  <script src="API.js" defer></script>
</head>
<body>
  <main>
    <h1>QuickNotes</h1>
    <p class="intro">A small client that talks to the JSONPlaceholder practice API.</p>

    <section aria-labelledby="new-note-heading">
      <h2 id="new-note-heading">New note</h2>
      <form id="note-form">
        <div class="field">
          <label for="title-input">Title (required, max 100 characters)</label>
          <input id="title-input" type="text" autocomplete="off">
        </div>

        <div class="field">
          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" rows="4"></textarea>
        </div>

        <button id="submit-btn" type="submit">Add note</button>
      </form>
    </section>

    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Notes</h2>
      <button id="load-btn" type="button">Load notes</button>

      <p id="status" role="status" aria-live="polite"></p>

      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
